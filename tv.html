<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Second Life TV</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050505;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
#player{position:absolute;inset:0 0 74px 0;background:#000}
iframe{border:0;width:100%;height:100%;background:#000}
#bar{position:absolute;left:0;right:0;bottom:0;height:74px;background:#151515;display:flex;align-items:center;gap:10px;padding:0 14px;box-sizing:border-box}
button,a.btn{background:#333;color:#fff;border:1px solid #666;border-radius:7px;padding:10px 14px;font-size:16px;text-decoration:none;cursor:pointer}
#name{flex:1;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.center{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;box-sizing:border-box}
.card{max-width:720px;background:#171717;border:1px solid #444;border-radius:14px;padding:28px}
.card h1{margin-top:0}.note{color:#bbb;line-height:1.5}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
input{width:min(520px,80vw);padding:11px;border-radius:7px;border:1px solid #666;background:#222;color:#fff;font-size:16px}
</style>
</head><body>
<div id="player"></div>
<div id="bar"><button onclick="step(-1)">Zurueck</button><button onclick="step(1)">Weiter</button><div id="name">Second Life TV</div><button onclick="off()">Aus</button></div>
<script>
const channels=[
["Das Erste","external","https://www.ardmediathek.de/live"],
["BR","external","https://www.ardmediathek.de/live"],
["HR","external","https://www.ardmediathek.de/live"],
["MDR","external","https://www.ardmediathek.de/live"],
["NDR","external","https://www.ardmediathek.de/live"],
["Radio Bremen","external","https://www.ardmediathek.de/live"],
["RBB","external","https://www.ardmediathek.de/live"],
["SR","external","https://www.ardmediathek.de/live"],
["SWR","external","https://www.ardmediathek.de/live"],
["WDR","external","https://www.ardmediathek.de/live"],
["ARTE","external","https://www.arte.tv/de/live/"],
["3sat","external","https://www.3sat.de/"],
["KiKA","external","https://www.kika.de/"],
["phoenix","external","https://www.ardmediathek.de/live"],
["tagesschau24","external","https://www.ardmediathek.de/live"],
["DW","external","https://www.dw.com/de/media-center/live-tv/s-100817"],
["YouTube","youtube",""],
["Twitch","twitch",""],
["18+","adult","https://www.xnxx.com/"]
];
let current=0;
const qs=new URLSearchParams(location.search);
if(qs.has("kanal")){const n=parseInt(qs.get("kanal"),10);if(!isNaN(n)&&n>=0&&n<channels.length)current=n}
const P=document.getElementById("player"),N=document.getElementById("name");
function card(title,text,buttons,extra=""){P.innerHTML=`<div class="center"><div class="card"><h1>${title}</h1><p class="note">${text}</p>${extra}<div class="actions">${buttons}</div></div></div>`}
function external(name,url){card(name,"Dieser Anbieter kann die Einbettung im Second-Life-TV blockieren. Öffne den offiziellen Sender bei Bedarf direkt.",`<a class="btn" href="${url}" target="_blank" rel="noopener noreferrer">Sender öffnen</a>`)}
function youtube(){
 card("YouTube","Füge eine YouTube-Video-ID ein. Der offizielle Embed-Player wird direkt im TV geladen.",
 `<button onclick="playYT()">Video laden</button><a class="btn" href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">YouTube öffnen</a>`,
 `<p><input id="ytid" placeholder="YouTube Video-ID"></p>`);
}
function playYT(){const id=document.getElementById("ytid").value.trim().replace(/[^A-Za-z0-9_-]/g,"");if(!id)return;P.innerHTML=`<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`}
function twitch(){
 card("Twitch","Twitch benötigt für eingebettete Streams einen Kanalnamen und die Parent-Domain. Für unsere GitHub-Seite ist die Parent-Domain bereits gesetzt.",
 `<button onclick="playTwitch()">Stream laden</button><a class="btn" href="https://www.twitch.tv/" target="_blank" rel="noopener noreferrer">Twitch öffnen</a>`,
 `<p><input id="twch" placeholder="Twitch Kanalname"></p>`);
}
function playTwitch(){const c=document.getElementById("twch").value.trim().replace(/[^A-Za-z0-9_]/g,"");if(!c)return;P.innerHTML=`<iframe src="https://player.twitch.tv/?channel=${encodeURIComponent(c)}&parent=ghostbrentley.github.io&autoplay=true" allow="autoplay; fullscreen" allowfullscreen></iframe>`}
function adult(){card("18+ Bereich","Die eingetragene Webseite erlaubt keine Einbettung. Sie kann direkt geöffnet werden. Nur für Erwachsene.",`<a class="btn" href="https://www.xnxx.com/" target="_blank" rel="noopener noreferrer">18+ Webseite öffnen</a>`)}
function load(n){current=(n+channels.length)%channels.length;const [name,type,url]=channels[current];N.textContent=`${current+1}/${channels.length} - ${name}`;if(type==="external")external(name,url);else if(type==="youtube")youtube();else if(type==="twitch")twitch();else adult()}
function step(d){load(current+d)}
function off(){card("Fernseher ausgeschaltet","","");N.textContent="AUS"}
load(current);
</script></body></html>
