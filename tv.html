<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Second Life TV</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050505;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
#player{position:absolute;inset:0 0 74px 0;background:#000}
iframe{border:0;width:100%;height:100%;background:#000}
#bar{position:absolute;left:0;right:0;bottom:0;height:74px;background:#151515;display:flex;align-items:center;gap:10px;padding:0 14px;box-sizing:border-box}
button,a.btn{background:#333;color:#fff;border:1px solid #666;border-radius:7px;padding:10px 14px;font-size:16px;text-decoration:none;cursor:pointer}
button:hover,a.btn:hover{background:#555}
#name{flex:1;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.center{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;box-sizing:border-box}
.card{max-width:650px;background:#171717;border:1px solid #444;border-radius:14px;padding:28px}
.card h1{margin-top:0}.note{color:#bbb;line-height:1.5}
</style>
</head>
<body>
<div id="player"></div>
<div id="bar">
<button onclick="step(-1)">Zurueck</button>
<button onclick="step(1)">Weiter</button>
<div id="name">Second Life TV</div>
<button onclick="off()">Aus</button>
</div>
<script>
const channels = [
 ["Das Erste","web","https://www.ardmediathek.de/live"],
 ["BR","web","https://www.ardmediathek.de/live"],
 ["HR","web","https://www.ardmediathek.de/live"],
 ["MDR","web","https://www.ardmediathek.de/live"],
 ["NDR","web","https://www.ardmediathek.de/live"],
 ["Radio Bremen","web","https://www.ardmediathek.de/live"],
 ["RBB","web","https://www.ardmediathek.de/live"],
 ["SR","web","https://www.ardmediathek.de/live"],
 ["SWR","web","https://www.ardmediathek.de/live"],
 ["WDR","web","https://www.ardmediathek.de/live"],
 ["ARTE","web","https://www.arte.tv/de/live/"],
 ["3sat","web","https://www.3sat.de/"],
 ["KiKA","web","https://www.kika.de/"],
 ["phoenix","web","https://www.ardmediathek.de/live"],
 ["tagesschau24","web","https://www.ardmediathek.de/live"],
 ["DW","web","https://www.ardmediathek.de/live"],
 ["YouTube","web","https://www.youtube.com/"],
 ["Twitch","web","https://www.twitch.tv/"],
 ["18+","adult","https://www.xnxx.com/"]
];

let current=0;
const qs=new URLSearchParams(location.search);
if(qs.has("kanal")){
 const n=parseInt(qs.get("kanal"),10);
 if(!isNaN(n)&&n>=0&&n<channels.length) current=n;
}

function adultPage(url){
 const p=document.getElementById("player");
 p.innerHTML="";
 const wrap=document.createElement("div");
 wrap.className="center";
 const card=document.createElement("div");
 card.className="card";
 const h=document.createElement("h1");
 h.textContent="18+ Bereich";
 const para=document.createElement("p");
 para.className="note";
 para.textContent="Die Webseite erlaubt keine Einbettung in den TV-Player. Du kannst sie stattdessen direkt im Browser öffnen. Nur für Erwachsene.";
 const a=document.createElement("a");
 a.className="btn";
 a.href=url;
 a.target="_blank";
 a.rel="noopener noreferrer";
 a.textContent="18+ Webseite öffnen";
 card.append(h,para,a);
 wrap.appendChild(card);
 p.appendChild(wrap);
}

function load(n){
 current=(n+channels.length)%channels.length;
 const [name,type,url]=channels[current];
 document.getElementById("name").textContent=(current+1)+"/"+channels.length+" - "+name;
 if(type==="adult"){adultPage(url);return;}
 const p=document.getElementById("player");
 p.innerHTML="";
 const f=document.createElement("iframe");
 f.src=url;
 f.allow="autoplay; fullscreen; picture-in-picture";
 f.allowFullscreen=true;
 f.referrerPolicy="strict-origin-when-cross-origin";
 p.appendChild(f);
}
function step(d){load(current+d)}
function off(){
 document.getElementById("player").innerHTML='<div class="center"><div class="card"><h1>Fernseher ausgeschaltet</h1></div></div>';
 document.getElementById("name").textContent="AUS";
}
load(current);
</script>
</body>
</html>
