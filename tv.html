<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Second Life TV</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050505;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
#player{position:absolute;inset:0 0 74px 0;background:#000}
iframe,video{border:0;width:100%;height:100%;background:#000}
#bar{position:absolute;left:0;right:0;bottom:0;height:74px;background:#151515;display:flex;align-items:center;gap:10px;padding:0 14px;box-sizing:border-box}
button{background:#333;color:white;border:1px solid #666;border-radius:7px;padding:10px 14px;font-size:16px;cursor:pointer}
button:hover{background:#555}
#name{flex:1;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status{position:absolute;inset:0 0 74px 0;display:flex;align-items:center;justify-content:center;text-align:center;color:#ddd;padding:30px;box-sizing:border-box}
</style>
</head>
<body>
<div id="player"><div id="status">SECOND LIFE TV<br><br>Sender wird geladen ...</div></div>
<div id="bar">
<button onclick="step(-1)">Zurueck</button>
<button onclick="step(1)">Weiter</button>
<div id="name">Second Life TV</div>
<button onclick="off()">Aus</button>
</div>
<script>
/*
  HINWEIS:
  Viele Sender-Webseiten sperren Einbettung, Geolokation oder den Second-Life-Browser.
  Fuer beste Ergebnisse hier direkte, legal nutzbare Video-/Player-URLs einsetzen.
  YouTube: https://www.youtube.com/embed/VIDEO_ID
  Twitch: Twitch verlangt bei Embeds einen passenden "parent"-Domainparameter.
*/
const channels = [
  ["Das Erste","https://www.ardmediathek.de/live"],
  ["BR","https://www.ardmediathek.de/live"],
  ["HR","https://www.ardmediathek.de/live"],
  ["MDR","https://www.ardmediathek.de/live"],
  ["NDR","https://www.ardmediathek.de/live"],
  ["Radio Bremen","https://www.ardmediathek.de/live"],
  ["RBB","https://www.ardmediathek.de/live"],
  ["SR","https://www.ardmediathek.de/live"],
  ["SWR","https://www.ardmediathek.de/live"],
  ["WDR","https://www.ardmediathek.de/live"],
  ["ARTE","https://www.arte.tv/de/live/"],
  ["3sat","https://www.3sat.de/"],
  ["KiKA","https://www.kika.de/"],
  ["phoenix","https://www.ardmediathek.de/live"],
  ["tagesschau24","https://www.ardmediathek.de/live"],
  ["DW","https://www.ardmediathek.de/live"],
  ["YouTube","https://www.youtube.com/"],
  ["Twitch","https://www.twitch.tv/"],
  ["18+ 1","https://www.xnxx.com/"]
];

let current = 0;
const qs = new URLSearchParams(location.search);
if (qs.has("kanal")) {
  const n = parseInt(qs.get("kanal"),10);
  if (!isNaN(n) && n >= 0 && n < channels.length) current=n;
}

function load(n){
  current=(n+channels.length)%channels.length;
  const [name,url]=channels[current];
  document.getElementById("name").textContent=(current+1)+"/"+channels.length+" - "+name;
  const p=document.getElementById("player");
  p.innerHTML="";
  const f=document.createElement("iframe");
  f.src=url;
  f.allow="autoplay; fullscreen; picture-in-picture";
  f.allowFullscreen=true;
  f.referrerPolicy="strict-origin-when-cross-origin";
  p.appendChild(f);
}
function step(d){load(current+d)}
function off(){
  document.getElementById("player").innerHTML='<div id="status">Fernseher ausgeschaltet</div>';
  document.getElementById("name").textContent="AUS";
}
load(current);
</script>
</body>
</html>
