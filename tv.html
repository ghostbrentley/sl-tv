<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Second Life TV</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050505;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
#player{position:absolute;inset:0 0 74px 0;background:#000}
iframe{border:0;width:100%;height:100%;background:#000}
#bar{position:absolute;left:0;right:0;bottom:0;height:74px;background:#151515;display:flex;align-items:center;gap:10px;padding:0 14px;box-sizing:border-box}
button,a.btn{background:#333;color:#fff;border:1px solid #666;border-radius:7px;padding:11px 15px;font-size:16px;text-decoration:none;cursor:pointer}
#name{flex:1;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.center{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;box-sizing:border-box}
.card{max-width:760px;background:#171717;border:1px solid #444;border-radius:14px;padding:28px}
.card h1{margin-top:0}.note{color:#bbb;line-height:1.5}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
input{width:min(520px,80vw);padding:11px;border-radius:7px;border:1px solid #666;background:#222;color:#fff;font-size:16px}
</style></head><body>
<div id="player"></div>
<div id="bar"><button onclick="step(-1)">Zurueck</button><button onclick="step(1)">Weiter</button><div id="name"></div><button onclick="off()">Aus</button></div>
<script>
const A="https://www.ardmediathek.de/live";
const Z="https://www.zdf.de/live-tv";
const R="https://plus.rtl.de/";
const J="https://www.joyn.de/live-tv";
const channels=[
["Das Erste","external",A],["BR","external",A],["HR","external",A],["MDR","external",A],
["NDR","external",A],["Radio Bremen","external",A],["RBB","external",A],["SR","external",A],
["SWR","external",A],["WDR","external",A],["ONE","external",A],["ARTE","external","https://www.arte.tv/de/live/"],
["KiKA","external",A],["3sat","external",Z],["ARD alpha","external",A],["tagesschau24","external",A],
["phoenix","external",A],["DW","external","https://www.dw.com/de/media-center/live-tv/s-100817"],
["ZDF","external",Z],["ZDFneo","external",Z],["ZDFinfo","external",Z],
["RTL","external",R],["VOX","external",R],["RTLZWEI","external",R],["NITRO","external",R],
["ntv","external",R],["SUPER RTL","external",R],
["ProSieben","external",J],["SAT.1","external",J],["Kabel Eins","external",J],["sixx","external",J],
["ProSieben MAXX","external",J],["SAT.1 Gold","external",J],["DMAX","external",J],["TLC","external",J],
["TELE 5","external",J],["WELT","external",J],["Comedy Central","external",J],
["YouTube","youtube",""],["Twitch","twitch",""],["18+","adult","https://www.xnxx.com/"]
];
let current=0; const qs=new URLSearchParams(location.search);
if(qs.has("kanal")){const n=parseInt(qs.get("kanal"),10);if(!isNaN(n)&&n>=0&&n<channels.length)current=n}
const P=document.getElementById("player"),N=document.getElementById("name");
function card(t,x,b,e=""){P.innerHTML=`<div class="center"><div class="card"><h1>${t}</h1><p class="note">${x}</p>${e}<div class="actions">${b}</div></div></div>`}
function external(name,url){card(name,"Öffne den offiziellen Live-TV-Anbieter. Falls die Webseite Login, Abo oder DRM verlangt, gilt das auch in Second Life.",`<a class="btn" href="${url}" target="_self">Sender öffnen</a>`)}
function youtube(){card("YouTube","YouTube-Video-ID eingeben.",`<button onclick="playYT()">Video laden</button><a class="btn" href="https://www.youtube.com/" target="_self">YouTube öffnen</a>`,`<p><input id="ytid" placeholder="YouTube Video-ID"></p>`)}
function playYT(){const id=document.getElementById("ytid").value.trim().replace(/[^A-Za-z0-9_-]/g,"");if(id)P.innerHTML=`<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`}
function twitch(){card("Twitch","Twitch-Kanalname eingeben.",`<button onclick="playTW()">Stream laden</button><a class="btn" href="https://www.twitch.tv/" target="_self">Twitch öffnen</a>`,`<p><input id="twch" placeholder="Twitch Kanalname"></p>`)}
function playTW(){const c=document.getElementById("twch").value.trim().replace(/[^A-Za-z0-9_]/g,"");if(c)P.innerHTML=`<iframe src="https://player.twitch.tv/?channel=${encodeURIComponent(c)}&parent=ghostbrentley.github.io&autoplay=true" allow="autoplay; fullscreen" allowfullscreen></iframe>`}
function adult(){card("18+ Bereich","Die Webseite wird nicht eingebettet. Sie kann direkt geöffnet werden. Nur für Erwachsene.",`<a class="btn" href="https://www.xnxx.com/" target="_self">18+ Webseite öffnen</a>`)}
function load(n){current=(n+channels.length)%channels.length;const [name,type,url]=channels[current];N.textContent=`${current+1}/${channels.length} - ${name}`;if(type==="external")external(name,url);else if(type==="youtube")youtube();else if(type==="twitch")twitch();else adult()}
function step(d){load(current+d)} function off(){card("Fernseher ausgeschaltet","","");N.textContent="AUS"} load(current);
</script></body></html>
